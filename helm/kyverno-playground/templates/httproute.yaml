{{- if .Values.httproute.enabled -}}
{{- $fullName := include "kyverno-playground.fullname" . -}}
{{- $svcPort := (index .Values "kyverno-playground" "service" "port") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    {{- if .Values.httproute.labels }}
    {{- with .Values.httproute.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  {{- if or (index .Values "kyverno-playground" "annotations") .Values.httproute.annotations }}
  annotations:
  {{- with .Values.httproute.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with (index .Values "kyverno-playground" "annotations") }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- with .Values.httproute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httproute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httproute.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ''
          kind: Service
          name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1
    {{- end }}
{{- end }}
