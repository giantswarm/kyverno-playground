# -- Name override
nameOverride: ""

# -- Full name override
fullnameOverride: ""

# Additional options defined in charts/kyverno-playground/values.yaml. Upstream docs: https://github.com/kyverno/playground
kyverno-playground:
  image:
    # -- Image registry
    registry: gsoci.azurecr.io
    # -- Image repository
    repository: "giantswarm/kyverno-playground"
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Image tag (will default to app version if not set)
    tag: ~

  # -- Name override
  nameOverride: ""

  # -- Full name override
  fullnameOverride: ""

  # -- Number of pod replicas
  replicaCount: 1

  # -- A writable volume to use for the TUF root initialization.
  tufRootMountPath: /.sigstore

  # -- Image pull secrets
  imagePullSecrets: []

  # -- Priority class name
  priorityClassName: ""

  serviceAccount:
    # -- Create service account
    create: true

    # -- Service account annotations
    annotations: {}

    # -- Service account name (required if `serviceAccount.create` is `false`)
    name: ""

  # -- Pod annotations
  podAnnotations: {}

  # -- Additional labels to add to each pod
  podLabels: {}

  global:
    # -- additional labels added on each resource
    labels:
      giantswarm.io/service-type: "managed"
      application.giantswarm.io/team: "shield"

  # -- Pod security context
  podSecurityContext:
    fsGroup: 2000

  # -- Container security context
  # @default -- See [values.yaml](values.yaml)
  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    privileged: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

  service:
    # -- Service type
    type: ClusterIP

    # -- Service port
    port: 8080

  # -- Liveness probe
  livenessProbe:
    httpGet:
      path: /
      port: http

  # -- Readiness probe
  readinessProbe:
    httpGet:
      path: /
      port: http

  httproute:
    # -- Enable HTTPRoute resource (Gateway API alternative to Ingress)
    # Requires Gateway API CRDs (v1) installed in cluster
    # https://gateway-api.sigs.k8s.io/
    enabled: false
    # -- Additional HTTPRoute labels
    labels: {}
    # -- Additional HTTPRoute annotations
    annotations: {}
    # -- Gateway API parentRefs (list of Gateway references)
    # Must reference an existing Gateway resource
    parentRefs: []
    #  - name: example-gateway
    #    namespace: gateway-system
    #    sectionName: https
    # -- List of hostnames for HTTPRoute
    hostnames: []
    #  - policy-reporter.example.com
    # -- HTTPRoute rules configuration
    # Allows advanced routing with matches and filters
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # Optional filters:
        # filters:
        #   - type: RequestHeaderModifier
        #     requestHeaderModifier:
        #       add:
        #         - name: X-Custom-Header
        #           value: value
        # Optional timeouts configuration:
        # timeouts:
        #  request: 30s
        #  backendRequest: 30s

  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  resources:
    # -- Container resource limits
    limits:
      # cpu: 100m
      # memory: 128Mi

    # -- Container resource requests
    requests:
      # cpu: 100m
      # memory: 128Mi

  autoscaling:
    # -- Enable autoscaling
    enabled: false

    # -- Min number of replicas
    minReplicas: 1

    # -- Max number of replicas
    maxReplicas: 100

    # -- Target CPU utilisation
    targetCPUUtilizationPercentage: 80

    # -- Target Memory utilisation
    targetMemoryUtilizationPercentage: ~

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

  config:
    gin:
      # -- Gin mode (`release` or `debug`)
      mode: release
      # -- Gin cors middleware
      cors: false
      # -- Gin logger middleware
      logger: false
      # -- Gin max body size
      maxBodySize: 2097152
    server:
      # -- Server host
      host: '0.0.0.0'
      # -- Server port
      port: 8080
    engine:
      # -- Builtin CRDs enabled (`argocd`, `cert-manager`, `prometheus-operator`, `tekton-pipelines`)
      builtinCrds: []
      # -- Paths to folders containing yaml definitions for CRDs
      localCrds: []
    # -- list of additional Kyverno Playground versions
    versions: []
      # - name: Kyverno v1.13
      #   url: https://playground.kyverno.io/
      # - name: Kyverno v1.12
      #   url: https://playground.kyverno.io/v1.12/

  mcp:
    # -- Enable the MCP server deployment
    enabled: false

    # -- Number of MCP server pod replicas
    replicaCount: 1

    # -- MCP server port
    port: 8080

    service:
      # -- MCP service type
      type: ClusterIP

      # -- MCP service port
      port: 8080

    httproute:
      # -- Enable HTTPRoute resource (Gateway API alternative to Ingress)
      # Requires Gateway API CRDs (v1) installed in cluster
      # https://gateway-api.sigs.k8s.io/
      enabled: false
      # -- Additional HTTPRoute labels
      labels: {}
      # -- Additional HTTPRoute annotations
      annotations: {}
      # -- Gateway API parentRefs (list of Gateway references)
      # Must reference an existing Gateway resource
      parentRefs: []
      #  - name: example-gateway
      #    namespace: gateway-system
      #    sectionName: https
      # -- List of hostnames for HTTPRoute
      hostnames: []
      #  - policy-reporter.example.com
      # -- HTTPRoute rules configuration
      # Allows advanced routing with matches and filters
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          # Optional filters:
          # filters:
          #   - type: RequestHeaderModifier
          #     requestHeaderModifier:
          #       add:
          #         - name: X-Custom-Header
          #           value: value
          # Optional timeouts configuration:
          # timeouts:
          #  request: 30s
          #  backendRequest: 30s

    # -- MCP container resource limits/requests
    resources:
      limits: {}
      requests: {}
