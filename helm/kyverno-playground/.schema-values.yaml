# Auxiliary input for `helm schema` (see .schema.yaml).
#
# The "kyverno-playground" dependency's values are nested under the
# "kyverno-playground:" key in values.yaml (standard Helm subchart-alias
# convention). Feeding the vendored charts/kyverno-playground/values.yaml to
# `helm schema` directly, as a second sibling --values file, does not
# reproduce that nesting: the generator merges input files by matching JSON
# path, and the subchart file has no top-level "kyverno-playground" key of
# its own -- its fields would land as extra top-level properties instead of
# inside "kyverno-playground".
#
# This file is charts/kyverno-playground/values.yaml, mechanically indented
# and nested under "kyverno-playground:" so it merges into the same JSON
# paths as the real override values in values.yaml.
kyverno-playground:
  # -- Optional sponsor text
  sponsor: ""

  ingress:
    # -- Enable ingress
    enabled: false

    # -- Ingress class name
    className: ""

    # -- Ingress annotations
    annotations: {}

    # -- Ingress hosts
    hosts: []
      # - host: chart-example.local
      #   paths:
      #     - path: /
      #       pathType: ImplementationSpecific

    # -- Ingress tls
    tls: []

  networkPolicy:
    # -- Enable egress restriction for the playground pods
    enabled: false

    # -- Allow DNS to in-cluster CoreDNS while keeping app egress internet-only
    allowClusterDNS: true

  # -- Cluster roles
  clusterRoles: []
    # - name: read-all
    #   apiGroups:
    #     - '*'
    #   resources:
    #     - '*'

  # -- Cluster roles
  roles: []
    # - name: read-all
    #   namespaces:
    #     - ns-1
    #     - ns-2
    #   apiGroups:
    #     - '*'
    #   resources:
    #     - '*'

  # -- Additonal container arguments
  extraArgs: {}
    # cluster: true

  config:
    cluster:
      # -- Enable connected cluster mode
      enabled: false
      # TODO: kube config flags

    ui:
      # -- Sponsor name
      sponsor: ''

  mcp:
    ingress:
      # -- Enable MCP ingress
      enabled: false

      # -- Ingress class name
      className: ""

      # -- Ingress annotations
      annotations: {}

      # -- Ingress hosts
      hosts: []
        # - host: mcp.chart-example.local
        #   paths:
        #     - path: /
        #       pathType: ImplementationSpecific

      # -- Ingress tls
      tls: []
