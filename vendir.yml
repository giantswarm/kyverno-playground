apiVersion: vendir.k14s.io/v1alpha1
kind: Config
minimumRequiredVersion: 0.12.0
directories:
- path: vendor
  contents:
  - path: .
    git:
      url: https://github.com/kyverno/playground
      ref: main
    includePaths:
    - charts/kyverno-playground/**/*
- path: helm/kyverno-playground/templates
  contents:
  - path: .
    directory:
      path: vendor/charts/kyverno-playground/templates